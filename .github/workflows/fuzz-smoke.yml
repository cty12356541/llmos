name: Schema fuzz smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Linux libFuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-08-01 --profile minimal

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded schema fuzz targets
        env:
          NLOS_FUZZ_RUNS: "2000"
          NLOS_FUZZ_TOOLCHAIN: nightly-2026-08-01
        run: scripts/run-fuzz-smoke.sh
