name: Rust cross-platform verification

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 夜间调度触发源：专供 scale-probe（10 万级规模探针过重，不适合逐 PR 运行）。
    # 注意 GitHub Actions 的 on 触发器是 workflow 级的，job 级用 if 条件过滤。
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # W29-G（B-SDK-LANG-EVAL）：Go/C# golden 探针所需工具链，与本地证据
      # 记录的版本对齐（Go 1.27.x、.NET SDK 8.0.4xx feature band）。
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # sdk/go 零第三方依赖（无 go.sum），显式关闭依赖缓存避免空缓存告警。
          cache: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install schema runtimes
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r requirements-schema.txt

      - name: Lint and regenerate schemas
        run: |
          npm run schema:lint
          npm run schema:check-generated

      - name: Type-check and test cross-language schema
        run: |
          npm run schema:typecheck
          npm run schema:test:typescript
          python tests/conformance/schema/envelope.py

      # W29-G（B-SDK-LANG-EVAL）：双语言 Envelope 家族 golden 探针与
      # TS/Python conformance 同门——三平台字节级一致是冻结 wire 的验收门。
      # GOTOOLCHAIN=local 防止 runner 侧自动下载工具链绕过上面的版本钉扎。
      - name: Run Go golden probe
        working-directory: sdk/go
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go test ./... -count=1

      - name: Run C# golden probe
        run: |
          dotnet --version
          dotnet run --project sdk/csharp/llmos-sabi-probe/llmos-sabi-probe.csproj

      - name: Test cross-language local IPC clients
        run: |
          npm run ipc:test:typescript
          python tests/conformance/ipc/client.py
          npm run directory:test:typescript
          python tests/conformance/ipc/directory_chain.py
          npm run takeover-control:test:typescript
          python tests/conformance/ipc/takeover_control.py
          npm run wait-control:test:typescript
          python tests/conformance/ipc/wait_control.py

      - name: Reject Protobuf breaking changes
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: npx --no-install buf breaking --against '.git#branch=origin/${{ github.base_ref }},subdir=schema'

      # B6-2（W28-F）：Windows 实机 platform kill 复验锚点。cargo test --workspace
      # 已隐式覆盖本目标，但独立具名步骤让 windows-latest 腿的 run 日志里出现
      # platform_kill 测试组，供证据文件回填精确 run 链接；置于 Test workspace
      # 之前，即使后续全仓测试失败也不影响本步骤先行落账。
      - name: Test platform kill contract on Windows
        if: runner.os == 'Windows'
        run: cargo test -p nlos-process --test platform_kill

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  scale-probe:
    # GitHub Actions 不支持按 job 声明触发器，用 if 限定：
    # 仅夜间 schedule 或手动 workflow_dispatch 运行，push/PR 一律跳过，
    # 避免 10 万级规模探针拖慢日常 CI。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Scale probe (include-ignored)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # --include-ignored 会执行两个被 #[ignore] 标记的规模探针：
      # crates/nlos-store/tests/store_scale.rs（10 万 Operation 元数据）
      # crates/nlos-runtime-tokio/tests/scale.rs（10 万 fiber）
      - name: Test workspace including ignored scale probes
        run: cargo test --workspace -- --include-ignored

  msrv:
    name: MSRV 1.97
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rust-toolchain.toml 固定 stable；此 job 显式安装 1.97 校验声明的 MSRV。
      # dtolnay/rust-toolchain 已收敛为 v1 单 tag + 必填 toolchain 输入的形式；
      # rustup 支持部分版本号（1.97 解析到最新 patch），cargo +1.97 同样有效。
      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # 独立 key 前缀，避免与 stable 工具链缓存键冲突
          key: msrv-${{ runner.os }}

      # rust-toolchain.toml 会把裸 cargo 钉在 stable 上，
      # 必须用 +1.97 显式工具链选择器覆盖，否则 MSRV 校验形同虚设
      - name: Check workspace on Rust 1.97
        run: cargo +1.97 check --workspace --all-targets
