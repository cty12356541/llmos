name: Ubuntu sharded scale diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharded-scale-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Ubuntu sharded scale diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: 4fc70be15a1ee848ebd99f9dad8771a328998ba7
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize evidence
        run: |
          DIAGNOSTIC_DIR="$RUNNER_TEMP/sharded-scale-diagnostic"
          mkdir -p "$DIAGNOSTIC_DIR"
          printf 'DIAGNOSTIC_DIR=%s\n' "$DIAGNOSTIC_DIR" >> "$GITHUB_ENV"
          printf 'source_sha=%s\nworkflow_sha=%s\n' "$SOURCE_SHA" "$GITHUB_SHA" > "$DIAGNOSTIC_DIR/revisions.txt"

      - name: Checkout measured source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract observer from workflow revision
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git show "$GITHUB_SHA:.github/scripts/scale_probe_observer.py" > "$RUNNER_TEMP/scale_probe_observer.py"
          test -z "$(git status --porcelain)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Record runner and effective toolchain
        run: |
          {
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-unavailable}" "${ImageVersion:-unavailable}"
            cat /etc/os-release
            uname -srvmo
            rustc -vV
            cargo -vV
            python3 --version
            lscpu
            getconf CLK_TCK
            cat /proc/self/cgroup
            grep -E '^(Cpus_allowed_list|Mems_allowed_list):' /proc/self/status
            cat /proc/meminfo
            lsblk -o NAME,TYPE,MAJ:MIN,SIZE,FSTYPE,MOUNTPOINTS
            tmpdir="$(python3 -c 'import tempfile; print(tempfile.gettempdir())')"
            printf 'benchmark_temp_dir=%s\n' "$tmpdir"
            findmnt -T "$tmpdir" -o TARGET,SOURCE,FSTYPE,MAJ:MIN,OPTIONS
            df -Th "$tmpdir" "$PWD" "$DIAGNOSTIC_DIR"
          } 2>&1 | tee "$DIAGNOSTIC_DIR/runner.txt"

      - name: Compile workspace debug test artifacts
        run: |
          result=0
          cargo test --workspace --locked --no-run --message-format=json > "$DIAGNOSTIC_DIR/cargo-build.jsonl" 2> "$DIAGNOSTIC_DIR/cargo-build.stderr" || result=$?
          cat "$DIAGNOSTIC_DIR/cargo-build.stderr" >&2
          printf '%s\n' "$result" > "$DIAGNOSTIC_DIR/compile-exit-code.txt"
          exit "$result"

      - name: Run and observe the exact sharded scale benchmark
        run: python3 -B "$RUNNER_TEMP/scale_probe_observer.py" "$DIAGNOSTIC_DIR"

      - name: Upload diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sharded-scale-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DIAGNOSTIC_DIR }}
          if-no-files-found: error
