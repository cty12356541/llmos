[package]
name = "nlos-ipc"
description = "Bounded transport-neutral local IPC framing and platform adapters for NLOS SABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
conformance-server = [
    "dep:nlos-operation",
    "dep:nlos-runtime",
    "dep:nlos-service-directory",
    "dep:nlos-store",
]

[[bin]]
name = "nlos-ipc-echo"
path = "src/bin/nlos-ipc-echo.rs"
required-features = ["conformance-server"]

[[bin]]
name = "nlos-directory-chain"
path = "src/bin/nlos-directory-chain.rs"
required-features = ["conformance-server"]

[dependencies]
nlos-schema = { path = "../nlos-schema" }
nlos-identity = { path = "../nlos-identity" }
nlos-types = { path = "../nlos-types" }
nlos-operation = { path = "../nlos-operation", optional = true }
nlos-runtime = { path = "../nlos-runtime", optional = true }
nlos-service-directory = { path = "../nlos-service-directory", optional = true }
nlos-store = { path = "../nlos-store", optional = true }
sha2.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
prost.workspace = true

# The workspace forbids `unsafe_code`, but the Windows named-pipe adapter
# needs one FFI call (`GetNamedPipeClientProcessId`) to read the OS-level
# client pid credential. Mirroring `nlos-store-fault`, this crate does NOT
# set `[lints] workspace = true`: inheriting it would forbid that bridge.
#
# 不继承 workspace lints 的副作用是连 clippy 约束一并丢失。这里显式恢复与
# workspace 同级的 clippy 检查，但刻意不声明 `rust.unsafe_code`（默认 allow）：
# unsafe 仅限 `src/windows.rs` 的 FFI 桥（与 store-fault 的 VFS 垫片同族的
# 指定 unsafe 审计点），逐块附 SAFETY 论证。
[lints.clippy]
all = "warn"
pedantic = "warn"
