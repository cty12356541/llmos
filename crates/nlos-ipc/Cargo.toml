[package]
name = "nlos-ipc"
description = "Bounded transport-neutral local IPC framing and platform adapters for NLOS SABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
conformance-server = [
    "dep:nlos-operation",
    "dep:nlos-runtime",
    "dep:nlos-service-directory",
    "dep:nlos-store",
]

[[bin]]
name = "nlos-ipc-echo"
path = "src/bin/nlos-ipc-echo.rs"
required-features = ["conformance-server"]

[[bin]]
name = "nlos-directory-chain"
path = "src/bin/nlos-directory-chain.rs"
required-features = ["conformance-server"]

[dependencies]
nlos-schema = { path = "../nlos-schema" }
nlos-identity = { path = "../nlos-identity" }
nlos-types = { path = "../nlos-types" }
nlos-operation = { path = "../nlos-operation", optional = true }
nlos-runtime = { path = "../nlos-runtime", optional = true }
nlos-service-directory = { path = "../nlos-service-directory", optional = true }
nlos-store = { path = "../nlos-store", optional = true }
sha2.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# F3-c3:named-pipe 对端凭据解析(GetNamedPipeClientProcessId/
# ServerProcessId、对端进程令牌 user SID 比对)在 workspace 基础特性之上
# 追加的 windows-sys 特性(同一 crate,零新增第三方依赖)。
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
ed25519-dalek.workspace = true
prost.workspace = true

# F3-c3 carve-out:named-pipe 对端凭据面必须直调 Win32 FFI(windows-sys),
# 无法在 unsafe_code=forbid 下表达。放弃 workspace lint 继承并本地重申
# 同强度的 clippy all/pedantic;unsafe 块仅存在于 src/windows.rs 的 FFI
# 调用点(逐块 SAFETY 论证),Unix 侧(lib.rs/unix.rs/handshake.rs)
# 保持零 unsafe。
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
