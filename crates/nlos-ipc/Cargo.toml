[package]
name = "nlos-ipc"
description = "Bounded transport-neutral local IPC framing and platform adapters for NLOS SABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
conformance-server = [
    "dep:nlos-operation",
    "dep:nlos-runtime",
    "dep:nlos-service-directory",
    "dep:nlos-store",
    "dep:nlos-types",
    "dep:sha2",
]

[[bin]]
name = "nlos-ipc-echo"
path = "src/bin/nlos-ipc-echo.rs"
required-features = ["conformance-server"]

[[bin]]
name = "nlos-directory-chain"
path = "src/bin/nlos-directory-chain.rs"
required-features = ["conformance-server"]

[dependencies]
nlos-schema = { path = "../nlos-schema" }
nlos-operation = { path = "../nlos-operation", optional = true }
nlos-runtime = { path = "../nlos-runtime", optional = true }
nlos-service-directory = { path = "../nlos-service-directory", optional = true }
nlos-store = { path = "../nlos-store", optional = true }
nlos-types = { path = "../nlos-types", optional = true }
sha2 = { workspace = true, optional = true }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
