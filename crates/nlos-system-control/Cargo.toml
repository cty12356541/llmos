[package]
name = "nlos-system-control"
description = "Typed SystemControl handler for TaskAuthority recovery operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["cli"]
cli = [
    "dep:nlos-ipc",
    "dep:nlos-clock",
    "dep:nlos-identity",
    "dep:tokio",
]
# Resident system_control daemon (D5): aggregates every inspector feature
# plus the `cli` transport surface, and adds the authorities the daemon owns
# even though no inspector adapter touches them (`nlos-artifact` for the
# commit-recovery worker, `nlos-channel` to open the topic authority) and
# Ed25519 seed parsing for the optional `--identity-key-file` bootstrap.
daemon = [
    "cli",
    "process",
    "resource",
    "plan",
    "runtime",
    "topic",
    "store",
    "application",
    "dep:nlos-artifact",
    "dep:nlos-channel",
    "dep:ed25519-dalek",
]
process = ["dep:nlos-process"]
resource = ["dep:nlos-resource"]
plan = ["dep:nlos-plan"]
runtime = ["dep:nlos-runtime", "dep:nlos-runtime-tokio"]
topic = ["dep:nlos-topic"]
store = ["dep:nlos-store", "dep:nlos-operation"]
application = ["dep:nlos-application"]

[[bin]]
name = "system-control-cli"
path = "src/bin/system-control-cli.rs"
required-features = ["cli"]

[[bin]]
name = "system-control-daemon"
path = "src/bin/system-control-daemon.rs"
required-features = ["daemon"]

[dependencies]
nlos-clock = { path = "../nlos-clock", optional = true }
nlos-commit-coordinator = { path = "../nlos-commit-coordinator" }
nlos-identity = { path = "../nlos-identity", optional = true }
nlos-schema = { path = "../nlos-schema" }
nlos-task = { path = "../nlos-task" }
nlos-types = { path = "../nlos-types" }
nlos-ipc = { path = "../nlos-ipc", optional = true }
nlos-process = { path = "../nlos-process", optional = true }
nlos-resource = { path = "../nlos-resource", optional = true }
nlos-plan = { path = "../nlos-plan", optional = true }
nlos-runtime = { path = "../nlos-runtime", optional = true }
nlos-runtime-tokio = { path = "../nlos-runtime-tokio", optional = true }
nlos-topic = { path = "../nlos-topic", optional = true }
nlos-store = { path = "../nlos-store", optional = true }
nlos-operation = { path = "../nlos-operation", optional = true }
nlos-application = { path = "../nlos-application", optional = true }
nlos-artifact = { path = "../nlos-artifact", optional = true }
nlos-channel = { path = "../nlos-channel", optional = true }
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true }
tokio = { workspace = true, optional = true, features = ["signal"] }

[dev-dependencies]
ed25519-dalek.workspace = true
nlos-ipc = { path = "../nlos-ipc" }
nlos-service-directory = { path = "../nlos-service-directory" }
nlos-channel = { path = "../nlos-channel" }
nlos-artifact = { path = "../nlos-artifact" }
nlos-identity = { path = "../nlos-identity" }
rusqlite.workspace = true
tokio.workspace = true

[lints]
workspace = true
