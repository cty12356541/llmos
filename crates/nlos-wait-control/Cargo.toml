[package]
name = "nlos-wait-control"
description = "Typed WaitControl handler over the durable WaitAuthority for local IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
conformance-server = ["dep:nlos-ipc", "dep:tokio"]
# Opt-in ADR-0011 authenticated service variant (`authenticated` module):
# consumes the `nlos-ipc` handshake transport facility, `IdentityAuthority`
# attestation verification, and the `AuthorityClock` wall reading. Never
# enabled by default; the local trust-domain path stays dependency-clean.
authenticated-server = [
    "dep:nlos-clock",
    "dep:nlos-identity",
    "dep:nlos-ipc",
    "dep:sha2",
    "dep:tokio",
]

[[bin]]
name = "wait-control-conformance"
path = "src/bin/wait-control-conformance.rs"
required-features = ["conformance-server"]

[dependencies]
nlos-channel = { path = "../nlos-channel" }
nlos-clock = { path = "../nlos-clock", optional = true }
nlos-identity = { path = "../nlos-identity", optional = true }
nlos-ipc = { path = "../nlos-ipc", optional = true }
nlos-schema = { path = "../nlos-schema" }
nlos-types = { path = "../nlos-types" }
nlos-wait = { path = "../nlos-wait" }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek.workspace = true
nlos-clock = { path = "../nlos-clock" }
nlos-identity = { path = "../nlos-identity" }
nlos-ipc = { path = "../nlos-ipc" }
prost.workspace = true
tokio.workspace = true

[lints]
workspace = true
