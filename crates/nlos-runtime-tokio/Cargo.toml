[package]
name = "nlos-runtime-tokio"
description = "Tokio implementation of the NLOS ExecutionFiber runtime contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util.workspace = true
nlos-channel = { path = "../nlos-channel" }
nlos-outbox = { path = "../nlos-outbox" }
nlos-process = { path = "../nlos-process" }
nlos-runtime = { path = "../nlos-runtime" }
nlos-store = { path = "../nlos-store" }
nlos-task = { path = "../nlos-task" }
nlos-types = { path = "../nlos-types" }
nlos-wait = { path = "../nlos-wait" }
# Promoted from dev-dependencies by W33-G because src/bin targets cannot
# link dev-dependencies: the `nlos-debug` bin opens the authority stores
# through read-only SQLite connections for its enumeration face (the
# authorities expose no listing APIs and the debugger must never create
# or migrate a store).
rusqlite.workspace = true
tokio.workspace = true

[dev-dependencies]
nlos-operation = { path = "../nlos-operation" }

