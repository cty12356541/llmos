[package]
name = "nlos-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nlos-artifact = { path = "../nlos-artifact" }
# Plan-declaration schema for compiling the package manifest `tasks`
# template segment into a TaskPlan proposal (ADR-0016 决定 1, W28-B
# template half). Read-only consumer of nlos-plan's public declaration
# types; this crate never opens a plan store.
nlos-plan = { path = "../nlos-plan" }
# TaskAuthority read surface backing the uninstall/rollback activity gate
# (W27-D): the gate resolves the package's durable background-task
# registrations inside its own transaction, then queries this authority
# for task liveness. Read-only consumer; no task-side writes.
nlos-task = { path = "../nlos-task" }
nlos-types = { path = "../nlos-types" }
rusqlite.workspace = true
# Authority-derived ApplicationId/InstallationId (domain-separated SHA-256),
# mirroring the nlos-artifact receipt-id derivation precedent.
sha2.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
nlos-identity = { path = "../nlos-identity" }
# Test-only fault-injection VFS shim for the kill-window matrix
# (tests/application_fault_injection.rs); never a production dependency.
nlos-store-fault = { path = "../nlos-store-fault" }

[lints]
workspace = true
