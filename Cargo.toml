[workspace]
members = [
    "crates/nlos-operation",
    "crates/nlos-store",
    "crates/nlos-types",
    "crates/nlos-runtime",
    "crates/nlos-runtime-tokio",
    "crates/nlos-outbox",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/cty12356541/llmos"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
