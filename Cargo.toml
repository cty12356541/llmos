[workspace]
members = [
    "crates/nlos-canonical",
    "crates/nlos-ipc",
    "crates/nlos-operation",
    "crates/nlos-schema",
    "crates/nlos-service-directory",
    "crates/nlos-store",
    "crates/nlos-types",
    "crates/nlos-runtime",
    "crates/nlos-runtime-tokio",
    "crates/nlos-outbox",
    "crates/nlos-store-fault",
    "crates/nlos-task",
    "crates/nlos-identity",
    "crates/nlos-capability",
    "crates/nlos-semantic",
    "crates/nlos-process",
    "crates/nlos-resource",
    "crates/nlos-artifact",
    "crates/nlos-commit-coordinator",
    "crates/nlos-system-control",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/cty12356541/llmos"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
minicbor = { version = "2.3.0", default-features = false, features = ["std"] }
prost = "0.14.4"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = { version = "0.11.0", default-features = false }
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
