[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlos-sdk"
version = "0.1.0"
description = "Python SDK for NLOS SABI local RPC, ServiceDirectory negotiation, and common metadata validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "protobuf==6.33.4",
    # Ed25519 挑战应答;隔离于 nlos_sdk/_signing.py 一层,选型待 maintainer 签认
    "pynacl>=1.5.0",
]

# L-012:gen/python/nlos/** 是无 __init__.py 的 PEP 420 命名空间包,单根
# packages.find 会静默漏收。多根 where 把 buf 钉扎输出(python:v33.4)直接
# 纳入 wheel——单一来源、无 vendor 副本可漂移;路径相对本 pyproject 解析,
# 仅支持从仓库内构建(本包只以 wheel 分发,sdist 不支持)。
[tool.setuptools.packages.find]
where = [".", "../../gen/python"]
include = ["nlos_sdk*", "nlos*"]
namespaces = true
