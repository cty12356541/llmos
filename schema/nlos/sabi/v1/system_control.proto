message TaskSummaryProjection {
  bytes task_id = 1;
  bytes plan_id = 2;
  bytes application_id = 3;
  uint64 installation_generation = 4;
  uint64 plan_revision = 5;
  TaskLifecycleState task_state = 6;
  TaskUndoClass undo_class = 7;
  bytes reservation_id = 8;
  bytes cell_id = 9;
  uint64 updated_at_ms = 10;
  uint64 expected_generation_or_revision = 11;
