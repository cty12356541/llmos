enum TaskUndoClass {
  TASK_UNDO_CLASS_UNSPECIFIED = 0;
  TASK_UNDO_CLASS_READ_ONLY = 1;
  TASK_UNDO_CLASS_REVERSIBLE = 2;
  TASK_UNDO_CLASS_COMPENSATABLE = 3;
  TASK_UNDO_CLASS_IRREVERSIBLE = 4;
