  TASK_LIFECYCLE_STATE_DRAFT = 1;
  TASK_LIFECYCLE_STATE_PROPOSED = 2;
  TASK_LIFECYCLE_STATE_WAITING_CONSENT = 3;
  TASK_LIFECYCLE_STATE_AUTHORIZED = 4;
  TASK_LIFECYCLE_STATE_RUNNING = 5;
  TASK_LIFECYCLE_STATE_WAITING_INPUT = 6;
  TASK_LIFECYCLE_STATE_WAITING_RESOURCE = 7;
  TASK_LIFECYCLE_STATE_WAITING_NETWORK = 8;
  TASK_LIFECYCLE_STATE_SUSPENDED = 9;
  TASK_LIFECYCLE_STATE_RECOVERING = 10;
  TASK_LIFECYCLE_STATE_CANCELLING = 11;
  TASK_LIFECYCLE_STATE_COMPLETING = 12;
  TASK_LIFECYCLE_STATE_CANCELLED = 13;
  TASK_LIFECYCLE_STATE_PARTIAL = 14;
  TASK_LIFECYCLE_STATE_COMPLETED = 15;
  TASK_LIFECYCLE_STATE_FAILED = 16;
  TASK_LIFECYCLE_STATE_DISPUTED = 17;
  TASK_LIFECYCLE_STATE_QUARANTINED = 18;
