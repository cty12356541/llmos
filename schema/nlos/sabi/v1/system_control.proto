syntax = "proto3";

package nlos.sabi.v1;

import "nlos/sabi/v1/envelope.proto";

enum ControlCommandSource {
  CONTROL_COMMAND_SOURCE_UNSPECIFIED = 0;
  CONTROL_COMMAND_SOURCE_TRUSTED_GUI = 1;
  CONTROL_COMMAND_SOURCE_NL_SHELL = 2;
  CONTROL_COMMAND_SOURCE_CLI = 3;
  CONTROL_COMMAND_SOURCE_STRUCTURED_API = 4;
  CONTROL_COMMAND_SOURCE_AUTOMATION = 5;
}

enum ControlScope {
  CONTROL_SCOPE_UNSPECIFIED = 0;
  CONTROL_SCOPE_SYSTEM = 1;
  CONTROL_SCOPE_OPERATION = 2;
  // Stage D (IPC-D8 / ADR-0025): explicit twelve-domain control scopes.
  CONTROL_SCOPE_WORKSPACE = 3;
  CONTROL_SCOPE_APPLICATION = 4;
  CONTROL_SCOPE_TASK = 5;
  CONTROL_SCOPE_TASK_GROUP = 6;
  CONTROL_SCOPE_TASK_NODE = 7;
  CONTROL_SCOPE_TASK_ATTEMPT = 8;
  CONTROL_SCOPE_PROCESS = 9;
  CONTROL_SCOPE_AGENT_INSTANCE = 10;
  CONTROL_SCOPE_EXECUTION_FIBER = 11;
  CONTROL_SCOPE_RESOURCE_GROUP = 12;
  CONTROL_SCOPE_CONTEXT = 13;
  CONTROL_SCOPE_TOPIC = 14;
  CONTROL_SCOPE_CHANNEL = 15;
  CONTROL_SCOPE_DEVICE = 16;
  CONTROL_SCOPE_CELL = 17;
}

enum SystemControlView {
  SYSTEM_CONTROL_VIEW_UNSPECIFIED = 0;
  SYSTEM_CONTROL_VIEW_ARTIFACT_COMMIT_RECOVERY = 1;
  SYSTEM_CONTROL_VIEW_SEMANTIC_COMMIT_RECOVERY = 2;
  SYSTEM_CONTROL_VIEW_RESOURCE_COMMIT_RECOVERY = 3;
  // B5-3 per-layer inspect views (W32-G): one bounded snapshot per
  // organizational/execution layer. Views 4..=8 address exactly one target
  // through the additive `target_id`/`plan_id`/`target_generation` fields.
  SYSTEM_CONTROL_VIEW_TASK_GROUP = 4;
  SYSTEM_CONTROL_VIEW_TASK_NODE = 5;
  SYSTEM_CONTROL_VIEW_EXECUTION_FIBER = 6;
  SYSTEM_CONTROL_VIEW_TOPIC = 7;
  SYSTEM_CONTROL_VIEW_OPERATION = 8;
  // Stage D (IPC-D1..D8): bounded twelve-domain enumeration, watermark,
  // settings/grant seams, blast-radius dry-run, and command reconciliation.
  SYSTEM_CONTROL_VIEW_TASK_LIST = 9;
  SYSTEM_CONTROL_VIEW_TASK_GROUP_LIST = 10;
  SYSTEM_CONTROL_VIEW_TASK_NODE_LIST = 11;
  SYSTEM_CONTROL_VIEW_TASK_ATTEMPT_LIST = 12;
  SYSTEM_CONTROL_VIEW_EXECUTION_FIBER_LIST = 13;
  SYSTEM_CONTROL_VIEW_OPERATION_LIST = 14;
  SYSTEM_CONTROL_VIEW_INSTALLED_APPLICATION_LIST = 15;
  SYSTEM_CONTROL_VIEW_SEARCH_CANDIDATE_QUERY = 16;
  SYSTEM_CONTROL_VIEW_DESKTOP_WATERMARK_POLL = 17;
  SYSTEM_CONTROL_VIEW_SETTINGS_DOMAIN = 18;
  SYSTEM_CONTROL_VIEW_CONTENT_TYPE_ASSOCIATION_LIST = 19;
  SYSTEM_CONTROL_VIEW_KEYCHAIN_REFERENCE_LIST = 20;
  SYSTEM_CONTROL_VIEW_CHOOSER_GRANT_LIST = 21;
  SYSTEM_CONTROL_VIEW_WORKSPACE_LIST = 22;
  SYSTEM_CONTROL_VIEW_WORKSPACE = 23;
  SYSTEM_CONTROL_VIEW_PROCESS_LIST = 24;
  SYSTEM_CONTROL_VIEW_RESOURCE_RESERVATION_LIST = 25;
  SYSTEM_CONTROL_VIEW_TOPIC_LIST = 26;
  SYSTEM_CONTROL_VIEW_NOTIFICATION_LIST = 27;
  SYSTEM_CONTROL_VIEW_CELL_LIST = 28;
  SYSTEM_CONTROL_VIEW_CELL_LEASE_INSPECT = 29;
  SYSTEM_CONTROL_VIEW_CONTROL_BLAST_RADIUS_PREVIEW = 30;
  SYSTEM_CONTROL_VIEW_CONTROL_COMMAND_STATUS = 31;
}

enum RecoveryWorkerLifecycleState {
  RECOVERY_WORKER_LIFECYCLE_STATE_UNSPECIFIED = 0;
  RECOVERY_WORKER_LIFECYCLE_STATE_STARTING = 1;
  RECOVERY_WORKER_LIFECYCLE_STATE_RUNNING = 2;
  RECOVERY_WORKER_LIFECYCLE_STATE_BACKING_OFF = 3;
  RECOVERY_WORKER_LIFECYCLE_STATE_FAULTED = 4;
  RECOVERY_WORKER_LIFECYCLE_STATE_STOPPED = 5;
}

enum RecoveryFailureAuthority {
  RECOVERY_FAILURE_AUTHORITY_UNSPECIFIED = 0;
  RECOVERY_FAILURE_AUTHORITY_TASK = 1;
  RECOVERY_FAILURE_AUTHORITY_ARTIFACT = 2;
  RECOVERY_FAILURE_AUTHORITY_COORDINATOR = 3;
  RECOVERY_FAILURE_AUTHORITY_WORKER = 4;
  RECOVERY_FAILURE_AUTHORITY_SEMANTIC = 5;
  RECOVERY_FAILURE_AUTHORITY_RESOURCE = 6;
}

message GetSystemControlRequest {
  SchemaIdentity schema = 1;
  SystemControlView view = 2;
  uint32 alert_limit = 3;
  // B5-3 (W32-G) additive per-layer addressing: the primary 16-byte target
  // (group_id / node_id / fiber_id / topic_id / operation_id) for views 4..=8,
  // empty for the recovery views 1..=3. The bounded member list of the
  // TASK_GROUP view reuses `alert_limit` as its truncation bound.
  bytes target_id = 4;
  // Owning plan for the TASK_NODE view (node ids are plan-scoped derivations);
  // empty for every other view.
  bytes plan_id = 5;
  // Handle generation for the EXECUTION_FIBER and OPERATION views (both
  // authorities resolve handles by id + generation); zero for every other
  // view.
  uint64 target_generation = 6;
}

// Deliberately excludes local diagnostic strings. A trusted local operator
// receives only bounded identities, typed authority classes, and counters.
message RecoveryFailureSummary {
  bytes plan_id = 1;
  RecoveryFailureAuthority authority = 2;
}

message ArtifactRecoveryMetrics {
  RecoveryWorkerLifecycleState worker_state = 1;
  uint64 completed_cycles = 2;
  uint64 total_inspected = 3;
  uint64 total_finalized = 4;
  uint64 consecutive_failed_cycles = 5;
  optional uint64 retry_delay_ms = 6;
  uint64 durable_retrying = 7;
  uint64 durable_escalated = 8;
  uint64 durable_unacknowledged_escalated = 9;
  uint64 durable_resolved = 10;
  repeated RecoveryFailureSummary last_failures = 11;
  // Sticky: the artifact half stopped scanning after exhausting its own
  // failure budget (the thread-level state stays authoritative for the run).
  bool domain_faulted = 12;
}

message ArtifactRecoveryAlertStatus {
  bytes plan_id = 1;
  uint64 total_failures = 2;
  RecoveryFailureAuthority last_failure_authority = 3;
  int64 first_failed_at_ms = 4;
  int64 last_failed_at_ms = 5;
  int64 escalated_at_ms = 6;
  ReceiptReference acknowledgement_receipt = 7;
}

message ArtifactRecoveryOperationsSnapshot {
  SchemaIdentity schema = 1;
  ArtifactRecoveryMetrics metrics = 2;
  repeated ArtifactRecoveryAlertStatus alerts = 3;
  bool alerts_truncated = 4;
}

// Semantic-domain projection of the dual-domain recovery worker health and
// the durable `task_semantic_recovery` ledger. The worker lifecycle and
// per-cycle counters it shares with the artifact domain stay on
// `ArtifactRecoveryMetrics`; this message carries only the semantic half.
message SemanticRecoveryMetrics {
  uint64 total_inspected = 1;
  uint64 total_finalized = 2;
  uint64 consecutive_failed_cycles = 3;
  uint64 durable_retrying = 4;
  uint64 durable_escalated = 5;
  uint64 durable_unacknowledged_escalated = 6;
  uint64 durable_resolved = 7;
  // Sticky: the semantic half stopped scanning after exhausting its own
  // failure budget while the artifact half keeps running.
  bool domain_faulted = 8;
}

message SemanticRecoveryAlertStatus {
  bytes plan_id = 1;
  uint64 total_failures = 2;
  RecoveryFailureAuthority last_failure_authority = 3;
  int64 first_failed_at_ms = 4;
  int64 last_failed_at_ms = 5;
  int64 escalated_at_ms = 6;
  ReceiptReference acknowledgement_receipt = 7;
}

message SemanticRecoveryOperationsSnapshot {
  SchemaIdentity schema = 1;
  SemanticRecoveryMetrics metrics = 2;
  repeated SemanticRecoveryAlertStatus alerts = 3;
  bool alerts_truncated = 4;
}

// Resource-domain projection (W28-C-3b, ADR-0017 G8): mirrors the semantic
// messages field-for-field over the schema v43 `task_resource_recovery`
// ledger. Worker lifecycle and cross-domain counters stay on
// `ArtifactRecoveryMetrics`; this message carries only the resource half.
message ResourceRecoveryMetrics {
  uint64 total_inspected = 1;
  uint64 total_finalized = 2;
  uint64 consecutive_failed_cycles = 3;
  uint64 durable_retrying = 4;
  uint64 durable_escalated = 5;
  uint64 durable_unacknowledged_escalated = 6;
  uint64 durable_resolved = 7;
  // Sticky: the resource half stopped scanning after exhausting its own
  // failure budget while the artifact and semantic halves keep running.
  bool domain_faulted = 8;
}

message ResourceRecoveryAlertStatus {
  bytes plan_id = 1;
  uint64 total_failures = 2;
  RecoveryFailureAuthority last_failure_authority = 3;
  int64 first_failed_at_ms = 4;
  int64 last_failed_at_ms = 5;
  int64 escalated_at_ms = 6;
  ReceiptReference acknowledgement_receipt = 7;
}

message ResourceRecoveryOperationsSnapshot {
  SchemaIdentity schema = 1;
  ResourceRecoveryMetrics metrics = 2;
  repeated ResourceRecoveryAlertStatus alerts = 3;
  bool alerts_truncated = 4;
}

// B5-3 per-layer inspect projections (W32-G). Each snapshot mirrors one
// authority's durable or runtime state through bounded identities, typed
// state classes, and counters only — the same discipline as the recovery
// snapshots above. Local diagnostics (paths, SQLite messages, digests beyond
// the pinned authority fields) never cross the boundary.

enum TaskGroupLifecycleState {
  TASK_GROUP_LIFECYCLE_STATE_UNSPECIFIED = 0;
  TASK_GROUP_LIFECYCLE_STATE_OPEN = 1;
  TASK_GROUP_LIFECYCLE_STATE_SEALED = 2;
  TASK_GROUP_LIFECYCLE_STATE_CANCEL_REQUESTED = 3;
  TASK_GROUP_LIFECYCLE_STATE_CANCELLING = 4;
  TASK_GROUP_LIFECYCLE_STATE_QUIESCING = 5;
  TASK_GROUP_LIFECYCLE_STATE_COMPLETED = 6;
  TASK_GROUP_LIFECYCLE_STATE_FAILED = 7;
  TASK_GROUP_LIFECYCLE_STATE_PARTIAL = 8;
  TASK_GROUP_LIFECYCLE_STATE_CANCELLED = 9;
  TASK_GROUP_LIFECYCLE_STATE_UNCERTAIN = 10;
  TASK_GROUP_LIFECYCLE_STATE_RECOVERING = 11;
  TASK_GROUP_LIFECYCLE_STATE_QUARANTINED = 12;
  TASK_GROUP_LIFECYCLE_STATE_EFFECT_UNKNOWN = 13;
}

enum TaskGroupMemberType {
  TASK_GROUP_MEMBER_TYPE_UNSPECIFIED = 0;
  TASK_GROUP_MEMBER_TYPE_CHILD_GROUP = 1;
  TASK_GROUP_MEMBER_TYPE_TASK_ATTEMPT = 2;
  TASK_GROUP_MEMBER_TYPE_AGENT_INSTANCE = 3;
}

enum TaskGroupMembershipState {
  TASK_GROUP_MEMBERSHIP_STATE_UNSPECIFIED = 0;
  TASK_GROUP_MEMBERSHIP_STATE_ACTIVE = 1;
  TASK_GROUP_MEMBERSHIP_STATE_REMOVED = 2;
}

message TaskGroupStatus {
  bytes group_id = 1;
  bytes task_id = 2;
  // Empty when the group is a tree root.
  bytes parent_group_id = 3;
  TaskGroupLifecycleState state = 4;
  uint64 membership_generation = 5;
  uint64 state_seq = 6;
  uint64 depth = 7;
  uint64 cancel_epoch = 8;
  int64 created_at_ms = 9;
  int64 updated_at_ms = 10;
}

message TaskGroupMemberStatus {
  TaskGroupMemberType member_type = 1;
  bytes member_id = 2;
  TaskGroupMembershipState membership_state = 3;
  uint64 membership_generation = 4;
  ReceiptReference admission_receipt = 5;
  ReceiptReference removal_receipt = 6;
}

message TaskGroupOperationsSnapshot {
  SchemaIdentity schema = 1;
  TaskGroupStatus group = 2;
  repeated TaskGroupMemberStatus members = 3;
  bool members_truncated = 4;
}

enum PlanNodeKind {
  PLAN_NODE_KIND_UNSPECIFIED = 0;
  PLAN_NODE_KIND_AGENT_ROLE = 1;
  PLAN_NODE_KIND_EXECUTABLE = 2;
}

enum PlanNodeLifecycleState {
  PLAN_NODE_LIFECYCLE_STATE_UNSPECIFIED = 0;
  PLAN_NODE_LIFECYCLE_STATE_DECLARED = 1;
  PLAN_NODE_LIFECYCLE_STATE_BLOCKED_DEPENDENCY = 2;
  PLAN_NODE_LIFECYCLE_STATE_ELIGIBLE = 3;
  PLAN_NODE_LIFECYCLE_STATE_WAITING_AUTHORIZATION = 4;
  PLAN_NODE_LIFECYCLE_STATE_WAITING_RESOURCE = 5;
  PLAN_NODE_LIFECYCLE_STATE_MATERIALIZING = 6;
  PLAN_NODE_LIFECYCLE_STATE_ACTIVE = 7;
  PLAN_NODE_LIFECYCLE_STATE_CHECKPOINTED = 8;
  PLAN_NODE_LIFECYCLE_STATE_EVICTED = 9;
  PLAN_NODE_LIFECYCLE_STATE_REHYDRATING = 10;
  PLAN_NODE_LIFECYCLE_STATE_COMPLETED = 11;
  PLAN_NODE_LIFECYCLE_STATE_FAILED = 12;
  PLAN_NODE_LIFECYCLE_STATE_CANCELLED = 13;
}

enum ContextResidencyTier {
  CONTEXT_RESIDENCY_TIER_UNSPECIFIED = 0;
  CONTEXT_RESIDENCY_TIER_METADATA_ONLY = 1;
  CONTEXT_RESIDENCY_TIER_COLD = 2;
  CONTEXT_RESIDENCY_TIER_WARM = 3;
  CONTEXT_RESIDENCY_TIER_HOT = 4;
  CONTEXT_RESIDENCY_TIER_RUNNING = 5;
}

message TaskNodeStatus {
  bytes plan_id = 1;
  bytes node_id = 2;
  PlanNodeKind kind = 3;
  PlanNodeLifecycleState state = 4;
  uint64 declared_revision = 5;
  // SHA-256 digest of the declared node content at `declared_revision`.
  bytes node_digest = 6;
  uint64 transition_count = 7;
  ContextResidencyTier residency_tier = 8;
  uint64 residency_transition_count = 9;
  uint64 first_declared_at_ms = 10;
  uint64 updated_at_ms = 11;
}

message TaskNodeOperationsSnapshot {
  SchemaIdentity schema = 1;
  TaskNodeStatus node = 2;
}

enum ExecutionFiberLifecycleState {
  EXECUTION_FIBER_LIFECYCLE_STATE_UNSPECIFIED = 0;
  EXECUTION_FIBER_LIFECYCLE_STATE_CREATED = 1;
  EXECUTION_FIBER_LIFECYCLE_STATE_READY = 2;
  EXECUTION_FIBER_LIFECYCLE_STATE_RUNNING = 3;
  EXECUTION_FIBER_LIFECYCLE_STATE_WAITING_IO = 4;
  EXECUTION_FIBER_LIFECYCLE_STATE_WAITING_MODEL = 5;
  EXECUTION_FIBER_LIFECYCLE_STATE_WAITING_TOOL = 6;
  EXECUTION_FIBER_LIFECYCLE_STATE_SUSPENDED = 7;
  EXECUTION_FIBER_LIFECYCLE_STATE_COMPLETED = 8;
  EXECUTION_FIBER_LIFECYCLE_STATE_FAILED = 9;
  EXECUTION_FIBER_LIFECYCLE_STATE_CANCELLED = 10;
}

enum ExecutionFiberPhase {
  EXECUTION_FIBER_PHASE_UNSPECIFIED = 0;
  EXECUTION_FIBER_PHASE_RUNNING = 1;
  EXECUTION_FIBER_PHASE_WAITING_EXTERNAL = 2;
  EXECUTION_FIBER_PHASE_BACKPRESSURE_WAIT = 3;
  EXECUTION_FIBER_PHASE_SUSPENDED = 4;
}

// Runtime-snapshot projection of one execution fiber. All time meters are
// bounded whole-millisecond projections of the adapter's Duration meters.
message ExecutionFiberStatus {
  bytes fiber_id = 1;
  uint64 generation = 2;
  ExecutionFiberLifecycleState state = 3;
  ExecutionFiberPhase lifecycle_phase = 4;
  uint64 active_cpu_ms = 5;
  uint64 elapsed_wall_ms = 6;
  uint64 scheduler_wait_ms = 7;
  uint64 external_wait_ms = 8;
  uint64 backpressure_wait_ms = 9;
  uint64 suspended_ms = 10;
}

message ExecutionFiberOperationsSnapshot {
  SchemaIdentity schema = 1;
  ExecutionFiberStatus fiber = 2;
}

message TopicStatus {
  bytes topic_id = 1;
  bytes channel_id = 2;
  uint64 channel_generation = 3;
  // Bounded declared topic name (authority-admitted bytes, NUL-free).
  bytes name = 4;
  uint64 active_subscriptions = 5;
  // SHA-256 digest of the admitted topic policy.
  bytes policy_digest = 6;
  uint64 created_at_ms = 7;
}

message TopicOperationsSnapshot {
  SchemaIdentity schema = 1;
  TopicStatus topic = 2;
}

enum DurableOperationState {
  DURABLE_OPERATION_STATE_UNSPECIFIED = 0;
  DURABLE_OPERATION_STATE_REGISTERED = 1;
  DURABLE_OPERATION_STATE_DISPATCHED = 2;
  DURABLE_OPERATION_STATE_CANCEL_REQUESTED = 3;
  DURABLE_OPERATION_STATE_COMPLETED = 4;
  DURABLE_OPERATION_STATE_FAILED = 5;
  DURABLE_OPERATION_STATE_CANCELLED_BEFORE_EFFECT = 6;
  DURABLE_OPERATION_STATE_PARTIAL_EFFECT = 7;
  DURABLE_OPERATION_STATE_EFFECT_UNKNOWN = 8;
}

// Durable state-machine row of one operation (the execution half of the
// Topic/Operation layer). Terminal states carry their outcome receipt.
message DurableOperationStatus {
  bytes operation_id = 1;
  uint64 generation = 2;
  DurableOperationState state = 3;
  uint64 cancel_epoch = 4;
  bytes owner_fiber_id = 5;
  uint64 owner_fiber_generation = 6;
  ReceiptReference outcome_receipt = 7;
}

message DurableOperationSnapshot {
  SchemaIdentity schema = 1;
  DurableOperationStatus operation = 2;
}

// ============================================================================
// Stage D (IPC-D1..D8 / ADR-0025): Twelve-Domain Bounded Enumeration,
// Watermark, Settings/Grant Seams, Cell Seam, Blast-Radius Dry-Run &
// Idempotent Command Reconciliation.
// ============================================================================

