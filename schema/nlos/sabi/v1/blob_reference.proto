syntax = "proto3";

package nlos.sabi.v1;

import "nlos/sabi/v1/envelope.proto";

// W82-B SABI v1.1 (D5 option B, L-015): large-payload reference primitive
// channel. Service dispatch name "blob_reference"; dispatched method strings
// are "mint_reference", "read_reference", "release_reference". Application
// messages carry references; authenticated, independently authorized reads
// return bytes only in this channel's bounded ReadReferenceResult.chunk.
// Payload bytes MUST NOT be written to ordinary request/response logs.
//
// A frame whose encoded payload exceeds MAX_BLOB_REFERENCE_PAYLOAD_BYTES
// (64 KiB) is rejected with a typed FrameTooLarge failure for that call only.
// A per-session budget bounds rejected/malformed frames (default: more
// than 8 within a 60s sliding window tears the connection down).
// Oversized payloads MUST travel by reference (BlobReference), never by
// enlarging this bound.
//
// `reference_id` is deliberately a bare `bytes` 16-byte id, never the
// envelope `CapabilityHandle` message: wire slots are session-local indices
// and must stay structurally distinct from reference identity (D5 §5.4).
// Every chunk read re-validates the token (rights, revocation, read count,
// TTL) and that the holder principal equals the resolving principal; a
// mid-read revocation stops the next chunk, so already-delivered chunks are
// a bounded leak (delivered chunks x 65408 bytes) by design. A reference id
// is object identity, not bearer authorization or a capability slot.
// After a service restart, old tokens MUST fail closed: a pinned descriptor
// cannot be recovered by reopening its stored path. A new mint is required.

// `blob_reference.mint_reference` request: the sender declares an existing
// file inside its own workspace fence. Mint verifies the fence (lexical +
// canonicalized), the whole-file digest, the size, and binds a fixed-block
// digest manifest with block size max_chunk_bytes (1..65408). The opened
// descriptor is pinned for all later
// reads and the path is never re-resolved, structurally eliminating the
// swap-the-target window.
message MintReferenceRequest {
  SchemaIdentity schema = 1;
  string path_handle = 2;
  bytes file_digest_sha256 = 3;
  uint64 size_bytes = 4;
  uint64 max_reads = 5;
  uint64 max_chunk_bytes = 6;
  uint64 valid_until_ms = 7;
  // Explicit 16-byte recipient PrincipalId, resolved through the identity
  // authority. Mint authorization binds this field and all file/constraint
  // fields to the authenticated sender; each read requires authenticated
  // principal == this recipient plus valid service/token authorization.
  // Missing/invalid recipient MUST be rejected by the service. Historical
  // messages without field 8 remain decodable, but confer no recipient grant.
  bytes recipient_principal_id = 8;
}

// `blob_reference.mint_reference` result.
message MintReferenceResult {
  SchemaIdentity schema = 1;
  bytes reference_id = 2;
  uint64 minted_at_ms = 3;
}

// `blob_reference.read_reference` request: one aligned mint-time block or
// the final short block. offset must align to the token's fixed block size;
// length_bytes is a receiving bound <=65408 and must fit the actual block.
// The service validates the whole block against its mint-time digest before
// returning bytes. It must not return an unverified partial block. Offset,
// file extent, overflow, TTL, read-count and holder checks belong to the
// service. No transport reassembly state machine is introduced.
message ReadReferenceRequest {
  SchemaIdentity schema = 1;
  bytes reference_id = 2;
  uint64 offset = 3;
  uint64 length_bytes = 4;
}

// `blob_reference.read_reference` result. `chunk_digest_sha256` is the
// digest of this exact mint-time block (including a final short block),
// verified before delivery, never only end-of-stream. chunk is at most
// 65408 bytes AND the complete encoded result is at most 65536 bytes.
// Services construct the canonical schema identity, rather than reflecting
// request extensions; bounded encoding remains mandatory for all results.
message ReadReferenceResult {
  SchemaIdentity schema = 1;
  bytes chunk = 2;
  uint64 offset = 3;
  bytes chunk_digest_sha256 = 4;
}

// `blob_reference.release_reference` request: hygienic early discard; TTL
// and read-count caps already bound convergence, so release is optional.
message ReleaseReferenceRequest {
  SchemaIdentity schema = 1;
  bytes reference_id = 2;
}

// `blob_reference.release_reference` result.
message ReleaseReferenceResult {
  SchemaIdentity schema = 1;
  bool released = 2;
}
