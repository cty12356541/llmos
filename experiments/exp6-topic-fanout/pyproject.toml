[project]
name = "exp6-topic-fanout"
version = "0.1.0"
description = "llmos exp6: Topic interest-filter fanout simulation - selectivity vs load, effective-complexity model validation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topicfan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
