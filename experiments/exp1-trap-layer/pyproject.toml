[project]
name = "exp1-trap-layer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
