[project]
name = "exp5-contamination-sim"
version = "0.1.0"
description = "llmos exp5: provenance gating + contact tracing + recall vs hallucination outbreak simulation"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contamsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
