# W80-E6B 第三方参考多组件 Application 工作区(独立 workspace 根,
# starter-assistant-app 先例):只 path 依赖仓库内公共权威 crate;
# 零新增第三方依赖(ed25519-dalek / sha2 沿用 starter 同版本)。
[workspace]
members = [
    "knowledge-observatory-app",
    "field-survey-app",
    "n1-baseline-sealer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
